        function parseNominalCell(cell) { if (!cell || cell.v === null || cell.v === undefined) return 0; if (typeof cell.v === 'number') return cell.v; return Number(String(cell.v).replace(/[^0-9-]/g, '')) || 0; }

        async function fetchKeuanganFromSheet() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&_=${Date.now()}`;
                const text = await (await fetch(url)).text();
                const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                let sumIn = 0, sumOut = 0, list = [];
                (json.table.rows || []).forEach(r => {
                    const tgl = r.c[0]?.f || (r.c[0]?.v ? String(r.c[0].v) : '');
                    const masuk = parseNominalCell(r.c[1]), keluar = parseNominalCell(r.c[2]);
                    const donasi = r.c[4]?.v ? String(r.c[4].v) : '-';
                    if (tgl.toLowerCase() === 'tanggal') return;
                    if (tgl || masuk || keluar || donasi !== '-') { sumIn += masuk; sumOut += keluar; list.push({ tanggal: tgl || '-', pemasukan: masuk, pengeluaran: keluar, donasi }); }
                });
                keuanganData = { totalPemasukan: sumIn, totalPengeluaran: sumOut, danaPembangunan: sumIn - sumOut, mutasiPembangunan: list };
                if (currentCategory === 'informasi' && currentSubmenu === 'kas') updateKasUI();

        function hitungTabunganQurban() {
            const sel = document.getElementById('qurban-jenis-select'), inpHarga = document.getElementById('qurban-harga-input'), inpCicil = document.getElementById('qurban-cicil-input'), inpBulan = document.getElementById('qurban-bulan-input');
            const outTerkumpul = document.getElementById('qurban-out-terkumpul'), outSubTerkumpul = document.getElementById('qurban-out-subterkumpul'), outKurang = document.getElementById('qurban-out-kurang'), outSubKurang = document.getElementById('qurban-out-subkurang'), outPersen = document.getElementById('qurban-prog-persen'), outBar = document.getElementById('qurban-prog-bar'), outRincian = document.getElementById('qurban-out-rincian');
            if (!sel || !inpHarga || !inpCicil || !inpBulan) return;
            const harga = Number(String(inpHarga.value).replace(/[^0-9]/g, '')) || 0; inpHarga.value = harga > 0 ? harga.toLocaleString('id-ID') : '';
            const cicil = Number(String(inpCicil.value).replace(/[^0-9]/g, '')) || 0; inpCicil.value = cicil > 0 ? cicil.toLocaleString('id-ID') : '';
            const bulan = Math.max(0, parseInt(String(inpBulan.value).replace(/[^0-9]/g, ''), 10) || 0); inpBulan.value = bulan;
            const terkumpul = cicil * bulan, kurang = Math.max(0, harga - terkumpul), lebih = terkumpul > harga ? terkumpul - harga : 0;
            const persen = harga > 0 ? Math.min(100, Math.round((terkumpul / harga) * 100)) : 0, sisaBulan = cicil > 0 ? Math.ceil(kurang / cicil) : 0;
            const namaHewan = sel.options[sel.selectedIndex]?.dataset?.label || 'Hewan Qurban';
            outTerkumpul.textContent = formatRupiah(terkumpul); outSubTerkumpul.textContent = `${formatRupiah(cicil)}/bln × ${bulan} bulan`;
            outKurang.textContent = formatRupiah(kurang); outSubKurang.textContent = kurang === 0 && harga > 0 ? (lebih > 0 ? `Lunas! (Lebih ${formatRupiah(lebih)})` : 'Alhamdulillah, Lunas 100%!') : (cicil > 0 ? `± ${sisaBulan}x cicilan lagi (@ ${formatRupiah(cicil)})` : 'Isi nominal cicilan/bulan');
            outPersen.textContent = `${persen}% Terkumpul`; outBar.style.width = `${persen}%`;
            outRincian.innerHTML = kurang === 0 && harga > 0 ? `Target <b>${namaHewan} (${formatRupiah(harga)})</b> sudah terpenuhi dari tabungan ${bulan} bulan.` : `Untuk <b>${namaHewan} (${formatRupiah(harga)})</b>, tabungan ${bulan} bulan terkumpul <b>${formatRupiah(terkumpul)}</b> sehingga kurangnya tinggal <b>${formatRupiah(kurang)}</b> lagi.`;
        }
