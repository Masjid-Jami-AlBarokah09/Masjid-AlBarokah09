        function formatRupiah(angka) {
            const num = Number(angka || 0);
            const prefix = num < 0 ? '-Rp ' : 'Rp ';
            return prefix + Math.abs(num).toLocaleString('id-ID');
        }

        function parseNominalCell(cell) {
            if (!cell || cell.v === null || cell.v === undefined) return 0;
            if (typeof cell.v === 'number') return cell.v;
            const cleaned = String(cell.v).replace(/[^0-9-]/g, '');
            return Number(cleaned) || 0;
        }

        async function fetchKeuanganFromSheet() {
            const statusEl = document.getElementById('sheet-sync-status');
            if (statusEl) statusEl.textContent = 'Menyinkronkan data dari Google Sheets...';

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&_=${Date.now()}`;
                const response = await fetch(url);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const json = JSON.parse(jsonString);
                const rows = json.table.rows || [];

                let sumPemasukan = 0;
                let sumPengeluaran = 0;
                const mutasiList = [];

                rows.forEach((row) => {
                    const tanggal = row.c[0]?.f || (row.c[0]?.v ? String(row.c[0].v) : '');
                    const pemasukan = parseNominalCell(row.c[1]);
                    const pengeluaran = parseNominalCell(row.c[2]);
                    const donasiBarang = row.c[4]?.v ? String(row.c[4].v) : '-';

                    if (tanggal.toLowerCase() === 'tanggal') return;

                    if (tanggal || pemasukan !== 0 || pengeluaran !== 0 || donasiBarang !== '-') {
                        sumPemasukan += pemasukan;
                        sumPengeluaran += pengeluaran;
                        mutasiList.push({
                            tanggal: tanggal || '-',
                            pemasukan,
                            pengeluaran,
                            donasi: donasiBarang
                        });
                    }
                });

                keuanganData.totalPemasukan = sumPemasukan;
                keuanganData.totalPengeluaran = sumPengeluaran;
                keuanganData.danaPembangunan = sumPemasukan - sumPengeluaran;
                keuanganData.mutasiPembangunan = mutasiList;

                const nowStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                keuanganData.lastSync = `Tersinkron otomatis dengan Google Sheets (Update ${nowStr} WIB)`;

                if (currentCategory === 'informasi' && currentSubmenu === 'kas') {
                    updateKasUI();
                }

            } catch (error) {
                console.error('Gagal mengambil data Spreadsheet:', error);
                keuanganData.lastSync = 'Gagal menyinkronkan: Pastikan akses Spreadsheet diset ke "Siapa saja yang memiliki link (Pelihat)".';
                if (statusEl) statusEl.textContent = keuanganData.lastSync;
            }
        }

            container.appendChild(toast);

            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);

        }

        function updateWaZakatLink() {
            const waBtn = document.getElementById('btn-wa-akad-zakat');

        function hitungZakatMaal(inputVal) {

            if (hasilEl) {

        function hitungZakatFitrah(inputVal) {
            const jiwa = Math.max(0, parseInt(String(inputVal).replace(/[^0-9]/g, ''), 10) || 0);
            const inputEl = document.getElementById('zakat-jiwa-input');
            if (inputEl) {
                inputEl.value = jiwa > 0 ? jiwa : '';
            }

            currentZakatJiwa = jiwa;
            currentZakatBerasKg = jiwa * 2.5;
            const totalLiter = jiwa * 3.5;

            const hasilBerasEl = document.getElementById('zakat-hasil-beras');
            const subLiterEl = document.getElementById('zakat-hasil-liter');
            if (hasilBerasEl) {
                const kgFormatted = currentZakatBerasKg.toLocaleString('id-ID', { minimumFractionDigits: currentZakatBerasKg % 1 === 0 ? 0 : 1, maximumFractionDigits: 1 });

            updateWaZakatLink();
        }

        function updateClock() {
            const now = new Date();
            const hEl = document.getElementById('flip-hour');
            const mEl = document.getElementById('flip-minute');
            const sEl = document.getElementById('flip-second');
            const dEl = document.getElementById('current-date-display');

            if (hEl) hEl.textContent = String(now.getHours()).padStart(2, '0');
            if (mEl) mEl.textContent = String(now.getMinutes()).padStart(2, '0');
            if (sEl) sEl.textContent = String(now.getSeconds()).padStart(2, '0');
            if (dEl) dEl.textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });

            const mDayEl = document.getElementById('masehi-day-num');
            const mMonthEl = document.getElementById('masehi-month-short');
            const mFullEl = document.getElementById('masehi-full-text');
            if (mDayEl && mMonthEl && mFullEl) {
                mDayEl.textContent = String(now.getDate()).padStart(2, '0');
                mMonthEl.textContent = now.toLocaleDateString('id-ID', { month: 'short' }).toUpperCase();
                mFullEl.textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
            }

            try {
                const hijriParts = new Intl.DateTimeFormat('id-ID-u-ca-islamic', {
                    day: 'numeric', month: 'long', year: 'numeric'
                }).formatToParts(now);

                const hDay = hijriParts.find(p => p.type === 'day')?.value || '10';
                const hMonth = hijriParts.find(p => p.type === 'month')?.value || 'Jumadilakhir';
                const hYear = hijriParts.find(p => p.type === 'year')?.value || '1448';

                const hDayEl = document.getElementById('hijri-day-num');
                const hFullEl = document.getElementById('hijri-full-text');
                if (hDayEl) hDayEl.textContent = String(hDay).padStart(2, '0');
                if (hFullEl) hFullEl.textContent = `${hDay} ${hMonth} ${hYear} H`;
            } catch (e) {}
        }
        setInterval(updateClock, 1000);

        function updateRamadanCountdown() {
            const ramadanDate = new Date('February 8, 2027 00:00:00').getTime();
            const now = new Date().getTime();
            const distance = Math.max(0, ramadanDate - now);

            const dEl = document.getElementById('cd-days');
            const hEl = document.getElementById('cd-hours');
            const mEl = document.getElementById('cd-minutes');
            const sEl = document.getElementById('cd-seconds');
            if (!dEl) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            dEl.textContent = String(days).padStart(2, '0');
            hEl.textContent = String(hours).padStart(2, '0');
            mEl.textContent = String(minutes).padStart(2, '0');
            sEl.textContent = String(seconds).padStart(2, '0');
        }
        setInterval(updateRamadanCountdown, 1000);

        async function fetchWeatherDataAndPrayer() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Bandung&country=Indonesia&method=20');
                const data = await res.json();
                const t = data.data.timings;
                
                if (document.getElementById('sholat-imsak')) {
                    document.getElementById('sholat-imsak').textContent = t.Imsak;
                    document.getElementById('sholat-subuh').textContent = t.Fajr;
                    document.getElementById('sholat-terbit').textContent = t.Sunrise;
                    document.getElementById('sholat-dzuhur').textContent = t.Dhuhr;
                    document.getElementById('sholat-ashar').textContent = t.Asr;
                    document.getElementById('sholat-maghrib').textContent = t.Maghrib;
                    document.getElementById('sholat-isya').textContent = t.Isha;
                }

                const weatherRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.9125&longitude=107.7025&current_weather=true');
                const weatherData = await weatherRes.json();
                const cw = weatherData.current_weather;
                
                if (document.getElementById('weather-temp')) {
                    document.getElementById('weather-topbar').innerHTML = `🌡️ Cigending, Bandung • Suhu: <b>${cw.temperature}°C</b>`;
                    document.getElementById('weather-temp').textContent = `${cw.temperature}°C`;
                    document.getElementById('weather-desc').textContent = cw.weathercode <= 2 ? "Cerah / Berawan" : "Berawan / Sejuk";
                    document.getElementById('weather-wind').textContent = `Kecepatan angin: ${cw.windspeed} km/jam`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = function () {
            updateNavigationUI();
            renderPage();
            updateClock();
            updateRamadanCountdown();
            fetchKeuanganFromSheet();
        };
    </script>
</body>
