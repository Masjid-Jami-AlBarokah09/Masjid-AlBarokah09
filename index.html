        let currentCategory = 'profil', currentSubmenu = 'beranda';

        function formatRupiah(n) {
            const num = Number(n || 0);
            return (num < 0 ? '-Rp ' : 'Rp ') + Math.abs(num).toLocaleString('id-ID');
        }

        function parseNominalCell(cell) {
            if (!cell || cell.v === null || cell.v === undefined) return 0;
            if (typeof cell.v === 'number') return cell.v;
            return Number(String(cell.v).replace(/[^0-9-]/g, '')) || 0;
        }

        async function fetchKeuanganFromSheet() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&_=${Date.now()}`;
                const text = await (await fetch(url)).text();
                const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                let sumIn = 0, sumOut = 0, list = [];
                (json.table.rows || []).forEach(r => {
                    const tgl = r.c[0]?.f || (r.c[0]?.v ? String(r.c[0].v) : '');
                    const masuk = parseNominalCell(r.c[1]), keluar = parseNominalCell(r.c[2]);
                    const donasi = r.c[4]?.v ? String(r.c[4].v) : '-';
                    if (tgl.toLowerCase() === 'tanggal') return;
                    if (tgl || masuk || keluar || donasi !== '-') {
                        sumIn += masuk; sumOut += keluar;
                        list.push({ tanggal: tgl || '-', pemasukan: masuk, pengeluaran: keluar, donasi });
                    }
                });
                keuanganData = { totalPemasukan: sumIn, totalPengeluaran: sumOut, danaPembangunan: sumIn - sumOut, mutasiPembangunan: list, lastSync: 'Tersinkron otomatis dengan Google Sheets' };
                if (currentCategory === 'informasi' && currentSubmenu === 'kas') updateKasUI();
            } catch (e) {
                keuanganData.lastSync = 'Pastikan akses Spreadsheet diset ke "Siapa saja yang memiliki link".';
            }
        }

        function updateKasUI() {
            const el = document.getElementById('val-dana-pembangunan'), sub = document.getElementById('sub-dana-pembangunan'), tb = document.getElementById('mutasi-pembangunan-tbody');
            if (el) el.textContent = formatRupiah(keuanganData.danaPembangunan);
            if (sub) sub.textContent = `Pemasukan: ${formatRupiah(keuanganData.totalPemasukan)} • Pengeluaran: ${formatRupiah(keuanganData.totalPengeluaran)}`;
            if (tb) tb.innerHTML = keuanganData.mutasiPembangunan.length
                ? keuanganData.mutasiPembangunan.map(i => `<tr><td class="py-3 px-4 font-semibold">${i.tanggal}</td><td class="py-3 px-4 font-mono font-bold text-emeraldDeep text-right">${i.pemasukan ? formatRupiah(i.pemasukan) : '-'}</td><td class="py-3 px-4 font-mono font-bold text-rose-700 text-right">${i.pengeluaran ? formatRupiah(i.pengeluaran) : '-'}</td><td class="py-3 px-4">${i.donasi}</td></tr>`).join('')
                : `<tr><td colspan="4" class="py-6 px-4 text-center text-stone-500">Belum ada data mutasi.</td></tr>`;
        }

        // Kalkulator Simulasi Tabungan Qurban + Perkiraan Progres Pembayaran
        function ubahJenisHewanQurban(val) {
            const inp = document.getElementById('qurban-harga-input');
            if (!inp) return;
            if (val !== 'custom') { inp.value = Number(val).toLocaleString('id-ID'); } else { inp.value = ''; inp.focus(); }
            hitungTabunganQurban();
        }

        function sinkronSetoranDariBulan() {
            const inpHarga = document.getElementById('qurban-harga-input');
            const tenSel = document.getElementById('qurban-tenor-select');
            const blnInp = document.getElementById('qurban-bulan-jalan-input');
            const masukInp = document.getElementById('qurban-sudah-masuk-input');
            if (!inpHarga || !tenSel || !blnInp || !masukInp) return;

            const harga = Number(String(inpHarga.value).replace(/[^0-9]/g, '')) || 0;
            const tenor = Math.max(1, parseInt(tenSel.value, 10) || 1);
            const cicilan = Math.ceil(harga / tenor);
            const bulanJalan = Math.min(tenor, Math.max(0, parseInt(String(blnInp.value).replace(/[^0-9]/g, ''), 10) || 0));
            blnInp.value = bulanJalan;

            const estimasiMasuk = Math.min(harga, cicilan * bulanJalan);
            masukInp.value = estimasiMasuk > 0 ? estimasiMasuk.toLocaleString('id-ID') : '0';
            hitungTabunganQurban();
        }

        function hitungTabunganQurban() {
            const sel = document.getElementById('qurban-jenis-select');
            const inpHarga = document.getElementById('qurban-harga-input');
            const tenSel = document.getElementById('qurban-tenor-select');
            const masukInp = document.getElementById('qurban-sudah-masuk-input');

            const outCicilan = document.getElementById('qurban-hasil-nominal');
            const subInfo = document.getElementById('qurban-hasil-subinfo');
            const outMasuk = document.getElementById('qurban-prog-masuk');
            const outSisa = document.getElementById('qurban-prog-sisa');
            const outPersen = document.getElementById('qurban-prog-persen');
            const outBar = document.getElementById('qurban-prog-bar');
            const outEstimasi = document.getElementById('qurban-prog-estimasi');

            if (!sel || !inpHarga || !tenSel || !outCicilan) return;

            const harga = Number(String(inpHarga.value).replace(/[^0-9]/g, '')) || 0;
            inpHarga.value = harga > 0 ? harga.toLocaleString('id-ID') : '';

            const tenor = Math.max(1, parseInt(tenSel.value, 10) || 1);
            const cicilanPerBulan = Math.ceil(harga / tenor);

            outCicilan.textContent = formatRupiah(cicilanPerBulan);
